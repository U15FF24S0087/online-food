<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodieHub | Cart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="logo" href="index.html">🍽 FoodieHub</a>
        <div class="nav-links">
          <a href="index.html">Login</a>
          <a href="home.html">Home</a>
          <a href="menu.html">Menu</a>
          <a class="active" href="cart.html">Cart</a>
          <a href="support.html">Support</a>
        </div>
      </nav>
    </header>

    <main>
      <h2>Your Order</h2>
      <section class="cart-list">
        <article class="cart-item">
          <strong>Classic Burger</strong>
          <div>$8.99 × 1</div>
        </article>
        <article class="cart-item">
          <strong>Chicken Wrap</strong>
          <div>$7.49 × 2</div>
        </article>
      </section>

      <section class="checkout-card">
        <h3>Checkout Summary</h3>
        <p>Subtotal: $23.97</p>
        <p>Delivery: $2.00</p>
        <p><strong>Total: $25.97</strong></p>
        <div class="btn-row">
          <a class="btn btn-primary" href="support.html">Confirm Order</a>
          <a class="btn btn-secondary" href="menu.html">Add More</a>
        </div>
      </section>
    </main>

    <footer>Fresh food, fast delivery, friendly support.</footer>
  </body>
</html>
