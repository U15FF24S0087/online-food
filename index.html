<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodieHub | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="logo" href="index.html">🍽 FoodieHub</a>
        <div class="nav-links">
          <a class="active" href="index.html">Login</a>
          <a href="home.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="cart.html">Cart</a>
          <a href="support.html">Support</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="login-card">
        <h2>Welcome back</h2>
        <p class="notice">Log in to order your favorite meals in seconds.</p>
        <form action="home.html">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter password" required />
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit">Login</button>
            <a class="btn btn-secondary" href="home.html">Guest View</a>
          </div>
        </form>
      </section>
    </main>

    <footer>Fresh food, fast delivery, friendly support.</footer>
  </body>
</html>
